model:
  tag: espnet/owsm_v4_base_102M
  lang_sym: <eng>
  task_sym: <asr>

dataset:
  path: google/fleurs
  subset: en_us
  train_split: train
  eval_split: test
  audio_column: audio
  text_column: transcription
  id_column: id
  sampling_rate: 16000
  train_examples: 16
  eval_examples: 16
  selection: head  # head or shuffle

training:
  steps: 10
  learning_rate: 3.0e-5
  max_grad_norm: 1.0
  batch_size: 1

runtime:
  seed: 13
  device: cuda
  output_dir: outputs/sft_smoke
