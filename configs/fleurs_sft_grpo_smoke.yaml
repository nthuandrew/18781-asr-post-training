# Shared model and FLEURS settings.
model_tag: espnet/owsm_v4_base_102M
fleurs_language: en_us
lang_sym: <eng>
task_sym: <asr>

# Small defaults intended to validate the full pipeline on one T4 GPU.
train_examples: 16
eval_examples: 16

# SFT settings.
sft_steps: 10
learning_rate: 3.0e-5

# GRPO settings.
grpo_steps: 5
num_hypotheses: 4
grpo_learning_rate: 1.0e-6
clip_epsilon: 0.2
kl_beta: 0.02
reward_format_weight: 1.0
reward_wer_weight: 1.5
wer_tolerance: 0.0

# Shared optimization and output settings.
max_grad_norm: 1.0

seed: 13
device: cuda
output_dir: outputs/fleurs_sft_grpo_smoke
