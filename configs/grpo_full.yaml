model:
  tag: espnet/owsm_v4_base_102M
  lang_sym: <eng>
  task_sym: <asr>

dataset:
  path: google/fleurs
  subset: en_us
  train_split: train
  eval_split: test
  audio_column: audio
  text_column: transcription
  id_column: id
  sampling_rate: 16000
  train_examples: null
  eval_examples: null
  selection: shuffle

training:
  steps: null
  epochs: 5
  learning_rate: 5.0e-6
  num_hypotheses: 16
  clip_epsilon: 0.2
  kl_beta: 0.01
  max_grad_norm: 2.0
  batch_size: 8
  log_candidates: false
  optimization_epochs: 4

reward:
  format_weight: 1.0
  wer_weight: 1.5
  wer_tolerance: 0.0

runtime:
  seed: 13
  device: cuda
  output_dir: outputs/grpo_full_v3
