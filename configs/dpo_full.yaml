model:
  tag: espnet/owsm_v4_base_102M
  lang_sym: <eng>
  task_sym: <asr>

dataset:
  path: google/fleurs
  subset: en_us
  train_split: train
  eval_split: test
  audio_column: audio
  text_column: transcription
  id_column: id
  sampling_rate: 16000
  train_examples: null
  eval_examples: null
  selection: shuffle

training:
  steps: null
  epochs: 5
  learning_rate: 1.0e-5
  num_hypotheses: 16
  beta: 0.1
  max_grad_norm: 2.0
  batch_size: 8
  log_candidates: false
  min_reward_margin: 0.05
  max_chosen_wer: 0.15

reward:
  format_weight: 1.0
  wer_weight: 1.5
  wer_tolerance: 0.0

runtime:
  seed: 13
  device: cuda
  output_dir: outputs/dpo_full_v3
