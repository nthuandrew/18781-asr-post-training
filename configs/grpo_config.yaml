model:
  base_model: "whisper-small"
  reference_model: "whisper-small"
  cache_dir: "./cache"

training:
  output_dir: "./outputs/grpo"
  learning_rate: 1.0e-6
  batch_size: 2
  gradient_accumulation_steps: 1
  epochs: 2
  num_hypotheses: 4
  kl_coeff: 0.05
  max_length: 512

logging:
  log_every_steps: 20
  save_every_steps: 200
  use_wandb: false
